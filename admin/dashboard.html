<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard · La Casa de las Fiestas</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Poppins',sans-serif;background:#F7F8FB;color:#11132A}
.nav{background:#fff;padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(17,19,42,0.07);position:sticky;top:0;z-index:100}
.nav-brand{display:flex;align-items:center;gap:10px}
.nav-icon{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#7C8CFF,#5DB7F2);display:flex;align-items:center;justify-content:center;font-size:18px}
.nav-text .n1{font-size:13px;font-weight:700;color:#11132A}
.nav-text .n2{font-size:10px;color:#7C8CFF;font-weight:500}
.nav-right{display:flex;align-items:center;gap:10px}
.nav-email{font-size:12px;color:#9899B0}
.btn-logout{padding:7px 16px;background:#FEE2E2;color:#991B1B;border:none;border-radius:100px;font-family:'Poppins',sans-serif;font-size:12px;font-weight:600;cursor:pointer}
.btn-logout:hover{opacity:.85}
.body{padding:24px 20px 60px;max-width:860px;margin:0 auto}
.header{margin-bottom:22px}
.header h1{font-size:20px;font-weight:800;color:#11132A;margin-bottom:2px}
.header p{font-size:12px;color:#9899B0}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
@media(max-width:600px){.kpi-grid{grid-template-columns:repeat(2,1fr)}}
.kpi{background:#fff;border-radius:18px;padding:16px 18px;box-shadow:0 2px 12px rgba(17,19,42,0.07);border:1px solid rgba(17,19,42,0.05)}
.kpi-icon{font-size:22px;margin-bottom:8px}
.kpi-v{font-size:28px;font-weight:800;color:#11132A;line-height:1}
.kpi-l{font-size:11px;color:#9899B0;margin-top:2px}
.inbox{background:#fff;border-radius:20px;box-shadow:0 2px 12px rgba(17,19,42,0.07);border:1px solid rgba(17,19,42,0.05);overflow:hidden}
.inbox-hd{padding:16px 20px;border-bottom:1px solid rgba(17,19,42,0.06);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.inbox-hd h2{font-size:15px;font-weight:700}
.inbox-hd span{font-size:11px;color:#9899B0}
.filters{display:flex;gap:6px;flex-wrap:wrap;padding:12px 20px;border-bottom:1px solid rgba(17,19,42,0.06)}
.fb{padding:5px 13px;border-radius:100px;font-size:11px;cursor:pointer;border:1.5px solid rgba(17,19,42,0.1);background:transparent;color:#9899B0;font-family:'Poppins',sans-serif;font-weight:500;transition:all .2s}
.fb.active{background:#7C8CFF;border-color:#7C8CFF;color:#fff}
.fb:hover:not(.active){border-color:#7C8CFF;color:#7C8CFF}
.ci{padding:14px 20px;border-bottom:1px solid rgba(17,19,42,0.05);cursor:pointer;transition:background .15s}
.ci:hover{background:#F7F8FB}
.ci:last-child{border-bottom:none}
.ci-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:4px}
.ci-nombre{font-size:13px;font-weight:600;color:#11132A}
.ci-salon{font-size:10px;font-weight:600;padding:2px 8px;border-radius:100px;margin-left:6px}
.ci-meta{font-size:11px;color:#9899B0;line-height:1.5}
.ci-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.ci-time{font-size:10px;color:#9899B0}
.stb{font-size:10px;padding:3px 9px;border-radius:100px;font-weight:600}
.st-nueva{background:#EEE8FF;color:#5B21B6}
.st-respondida{background:#D1FAE5;color:#065F46}
.st-reservada{background:#E4FAF6;color:#0F6E56}
.st-perdida{background:#FEE2E2;color:#991B1B}
.st-cancelada{background:#F3F4F6;color:#6B7280}
.det{background:#F7F8FB;padding:0;max-height:0;overflow:hidden;transition:max-height .3s ease,padding .3s ease;border-bottom:1px solid rgba(17,19,42,0.05)}
.det.open{max-height:500px;padding:16px 20px}
.det-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
@media(max-width:480px){.det-grid{grid-template-columns:1fr}}
.det-f{background:#fff;border-radius:10px;padding:10px 12px}
.det-l{font-size:9px;font-weight:600;color:#9899B0;letter-spacing:.8px;text-transform:uppercase;margin-bottom:2px}
.det-v{font-size:12px;font-weight:500;color:#11132A}
.det-msg{background:#fff;border-radius:10px;padding:10px 12px;margin-bottom:12px}
.det-acts{display:flex;gap:8px;flex-wrap:wrap}
.da{padding:8px 18px;border-radius:100px;font-family:'Poppins',sans-serif;font-size:11px;font-weight:600;cursor:pointer;border:1.5px solid;transition:all .2s}
.da-ok{background:#D1FAE5;color:#065F46;border-color:#A7F3D0}
.da-wa{background:#DCFCE7;color:#15803D;border-color:#BBF7D0}
.da-no{background:transparent;color:#E24B4A;border-color:#FECACA}
.empty{text-align:center;padding:48px 20px;color:#9899B0}
.empty span{font-size:40px;display:block;margin-bottom:12px}
.empty p{font-size:13px}
.loading{text-align:center;padding:32px;color:#9899B0;font-size:13px}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-brand">
    <div class="nav-icon">🏠</div>
    <div class="nav-text">
      <div class="n1">La Casa de las Fiestas</div>
      <div class="n2">Panel de gestión</div>
    </div>
  </div>
  <div class="nav-right">
    <span class="nav-email" id="user-email"></span>
    <button class="btn-logout" onclick="logout()">Salir</button>
  </div>
</nav>

<div class="body">
  <div class="header">
    <h1>Consultas recibidas</h1>
    <p id="subtitulo">Cargando...</p>
  </div>

  <div class="kpi-grid">
    <div class="kpi"><div class="kpi-icon">💬</div><div class="kpi-v" id="kpi-total">—</div><div class="kpi-l">Total consultas</div></div>
    <div class="kpi"><div class="kpi-icon">🆕</div><div class="kpi-v" id="kpi-nuevas" style="color:#7C8CFF">—</div><div class="kpi-l">Nuevas</div></div>
    <div class="kpi"><div class="kpi-icon">✅</div><div class="kpi-v" id="kpi-reservadas" style="color:#0F6E56">—</div><div class="kpi-l">Reservadas</div></div>
    <div class="kpi"><div class="kpi-icon">🏛️</div><div class="kpi-v" style="color:#5DB7F2">4</div><div class="kpi-l">Salones activos</div></div>
  </div>

  <div class="inbox">
    <div class="inbox-hd">
      <h2>Todas las consultas</h2>
      <span>WhatsApp · Web · Instagram · Facebook</span>
    </div>
    <div class="filters">
      <button class="fb active" onclick="setFilter(this,'todas')">Todas</button>
      <button class="fb" onclick="setFilter(this,'nueva')">Nuevas</button>
      <button class="fb" onclick="setFilter(this,'reservada')">Reservadas</button>
      <button class="fb" onclick="setFilter(this,'aserran')">Aserrán</button>
      <button class="fb" onclick="setFilter(this,'chiquiclub')">ChiquiClub</button>
      <button class="fb" onclick="setFilter(this,'acuarelas')">Acuarelas</button>
      <button class="fb" onclick="setFilter(this,'aserrin-aserran')">Aserrín AA</button>
    </div>
    <div id="lista"><div class="loading">Cargando consultas...</div></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script>
const SALON_COLORS = {
  'aserran':         { bg:'rgba(123,94,167,.12)',  color:'#7B5EA7' },
  'chiquiclub':      { bg:'rgba(230,93,155,.12)',  color:'#E65D9B' },
  'acuarelas':       { bg:'rgba(123,47,190,.12)',  color:'#7B2FBE' },
  'aserrin-aserran': { bg:'rgba(201,160,0,.12)',   color:'#C9A000' },
}

let todas = []
let filtroActivo = 'todas'

/* ── PROTECCIÓN ── */
async function init() {
  const { data: { session } } = await supabaseClient.auth.getSession()
  if (!session) { window.location.href = 'index.html'; return }
  document.getElementById('user-email').textContent = session.user.email
  await cargar()
}

/* ── LOGOUT ── */
async function logout() {
  await supabaseClient.auth.signOut()
  window.location.href = 'index.html'
}

/* ── CARGAR CONSULTAS ── */
async function cargar() {
  const { data, error } = await supabaseClient
    .from('consultas')
    .select('*')
    .order('created_at', { ascending: false })

  if (error) {
    document.getElementById('lista').innerHTML =
      `<div class="empty"><span>⚠️</span><p>Error: ${error.message}</p></div>`
    return
  }

  todas = data || []
  actualizarKPIs()
  renderLista()

  const hoy = new Date().toLocaleDateString('es-UY', { weekday:'long', day:'numeric', month:'long' })
  document.getElementById('subtitulo').textContent =
    `${todas.length} consultas totales · ${hoy}`
}

function actualizarKPIs() {
  document.getElementById('kpi-total').textContent     = todas.length
  document.getElementById('kpi-nuevas').textContent    = todas.filter(c => c.estado === 'nueva').length
  document.getElementById('kpi-reservadas').textContent = todas.filter(c => c.estado === 'reservada').length
}

/* ── FILTROS ── */
function setFilter(btn, f) {
  document.querySelectorAll('.fb').forEach(b => b.classList.remove('active'))
  btn.classList.add('active')
  filtroActivo = f
  renderLista()
}

function getFiltradas() {
  if (filtroActivo === 'todas') return todas
  if (['nueva','respondida','reservada','perdida','cancelada'].includes(filtroActivo))
    return todas.filter(c => c.estado === filtroActivo)
  return todas.filter(c => c.salon_id === filtroActivo)
}

/* ── RENDER ── */
function renderLista() {
  const items = getFiltradas()
  const lista = document.getElementById('lista')

  if (items.length === 0) {
    lista.innerHTML = `<div class="empty"><span>📭</span><p>No hay consultas con este filtro.</p></div>`
    return
  }

  lista.innerHTML = items.map(c => {
    const sc = SALON_COLORS[c.salon_id] || { bg:'#EEE8FF', color:'#5B21B6' }
    const fecha = c.fecha_evento
      ? new Date(c.fecha_evento + 'T00:00:00').toLocaleDateString('es-UY', { day:'numeric', month:'short', year:'numeric' })
      : '—'
    const creado = new Date(c.created_at).toLocaleDateString('es-UY', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' })

    return `
      <div class="ci" onclick="toggleDet('${c.id}')">
        <div class="ci-row">
          <div>
            <span class="ci-nombre">${c.nombre_cliente || '—'}</span>
            <span class="ci-salon" style="background:${sc.bg};color:${sc.color}">${c.salon_nombre || c.salon_id}</span>
          </div>
          <div class="ci-right">
            <span class="stb st-${c.estado}">${c.estado}</span>
            <span class="ci-time">${creado}</span>
          </div>
        </div>
        <div class="ci-meta">${c.tipo_evento} · ${c.cantidad_invitados} personas · ${fecha} · ${c.telefono}</div>
      </div>
      <div class="det" id="det-${c.id}">
        <div class="det-grid">
          <div class="det-f"><div class="det-l">Teléfono</div><div class="det-v">${c.telefono}</div></div>
          <div class="det-f"><div class="det-l">Fecha evento</div><div class="det-v">${fecha}</div></div>
          <div class="det-f"><div class="det-l">Horario</div><div class="det-v">${c.horario || '—'}</div></div>
          <div class="det-f"><div class="det-l">Invitados</div><div class="det-v">${c.cantidad_invitados}</div></div>
          <div class="det-f"><div class="det-l">Email</div><div class="det-v">${c.email || '—'}</div></div>
          <div class="det-f"><div class="det-l">Estado</div><div class="det-v"><span class="stb st-${c.estado}">${c.estado}</span></div></div>
        </div>
        ${c.mensaje ? `<div class="det-msg"><div class="det-l" style="margin-bottom:4px">Mensaje</div><div class="det-v">${c.mensaje}</div></div>` : ''}
        <div class="det-acts">
          <button class="da da-ok" onclick="cambiarEstado('${c.id}','reservada');event.stopPropagation()">✓ Reservada</button>
          <button class="da da-wa" onclick="responderWA('${c.id}');event.stopPropagation()">💬 WhatsApp</button>
          <button class="da da-no" onclick="cambiarEstado('${c.id}','perdida');event.stopPropagation()">✗ Perdida</button>
        </div>
      </div>`
  }).join('')
}

function toggleDet(id) {
  document.getElementById('det-' + id).classList.toggle('open')
}

/* ── CAMBIAR ESTADO ── */
async function cambiarEstado(id, nuevoEstado) {
  const { error } = await supabaseClient
    .from('consultas')
    .update({ estado: nuevoEstado })
    .eq('id', id)

  if (!error) {
    const idx = todas.findIndex(c => c.id === id)
    if (idx > -1) todas[idx].estado = nuevoEstado
    actualizarKPIs()
    renderLista()
  }
}

/* ── RESPONDER POR WHATSAPP ── */
function responderWA(id) {
  const c = todas.find(c => c.id === id)
  if (!c) return
  const msg = encodeURIComponent(
    `Hola ${c.nombre_cliente}, te contactamos desde *La Casa de las Fiestas* por tu consulta para *${c.salon_nombre}*.\n\n` +
    `Evento: ${c.tipo_evento} · ${c.fecha_evento} · ${c.cantidad_invitados} personas.\n\n` +
    `¿Podemos confirmar la disponibilidad? 🎉`
  )
  window.open(`https://wa.me/${c.telefono.replace(/\D/g,'')}?text=${msg}`, '_blank')
}

init()
</script>
</body>
</html>
