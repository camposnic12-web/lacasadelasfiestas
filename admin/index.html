<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin · La Casa de las Fiestas</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Poppins',sans-serif;background:#F7F8FB;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:24px;padding:40px 32px;width:100%;max-width:380px;box-shadow:0 4px 24px rgba(17,19,42,0.10)}
.logo{text-align:center;margin-bottom:28px}
.logo-icon{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,#7C8CFF,#5DB7F2);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:26px}
.logo h1{font-size:18px;font-weight:700;color:#11132A;margin-bottom:2px}
.logo p{font-size:12px;color:#9899B0}
.fg{margin-bottom:16px}
.fg label{display:block;font-size:11px;font-weight:600;color:#4A4C6A;margin-bottom:6px}
.fg input{width:100%;padding:12px 15px;border:1.5px solid rgba(17,19,42,0.12);border-radius:12px;font-family:'Poppins',sans-serif;font-size:13px;color:#11132A;outline:none;transition:border .2s}
.fg input:focus{border-color:#7C8CFF;box-shadow:0 0 0 3px rgba(124,140,255,.1)}
.btn{width:100%;padding:14px;background:linear-gradient(135deg,#7C8CFF,#5DB7F2);color:#fff;border:none;border-radius:12px;font-family:'Poppins',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:opacity .2s;margin-top:6px}
.btn:hover{opacity:.92}
.btn:disabled{opacity:.6;cursor:not-allowed}
.error{background:#FEE2E2;color:#991B1B;border-radius:10px;padding:10px 14px;font-size:12px;margin-top:14px;display:none}
.error.show{display:block}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">🏠</div>
    <h1>Panel de gestión</h1>
    <p>La Casa de las Fiestas</p>
  </div>
  <div class="fg">
    <label>Email</label>
    <input type="email" id="email" placeholder="tu@email.com" autocomplete="email">
  </div>
  <div class="fg">
    <label>Contraseña</label>
    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
  </div>
  <button class="btn" id="btn" onclick="login()">Ingresar al panel</button>
  <div class="error" id="error">Email o contraseña incorrectos.</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script>
supabaseClient.auth.getSession().then(({ data: { session } }) => {
  if (session) window.location.href = 'dashboard.html'
})
document.getElementById('password').addEventListener('keydown', e => {
  if (e.key === 'Enter') login()
})
async function login() {
  const email = document.getElementById('email').value.trim()
  const password = document.getElementById('password').value
  const btn = document.getElementById('btn')
  const error = document.getElementById('error')
  if (!email || !password) { error.textContent = 'Completá email y contraseña.'; error.classList.add('show'); return }
  btn.disabled = true
  btn.textContent = 'Ingresando...'
  error.classList.remove('show')
  const { error: err } = await supabaseClient.auth.signInWithPassword({ email, password })
  if (err) {
    error.textContent = 'Email o contraseña incorrectos.'
    error.classList.add('show')
    btn.disabled = false
    btn.textContent = 'Ingresar al panel'
  } else {
    window.location.href = 'dashboard.html'
  }
}
</script>
</body>
</html>
